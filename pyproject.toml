[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fhis-verification-signal"
version = "0.1.0"
description = "v0 experiment for detecting first harmful invalid steps from model hidden states."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.19.0",
  "matplotlib>=3.8.0",
  "numpy>=1.24.0",
  "openai>=1.40.0",
  "pandas>=2.0.0",
  "pyyaml>=6.0.0",
  "safetensors>=0.4.3",
  "scikit-learn>=1.4.0",
  "scipy>=1.10.0",
  "torch>=2.2.0",
  "tqdm>=4.66.0",
  "transformers>=4.45.0",
  "vllm>=0.14.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
