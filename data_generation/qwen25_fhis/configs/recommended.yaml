seed: 20260505

dataset:
  hf_name: Hothan/OlympiadBench
  subset: OE_TO_maths_en_COMP
  split: train
  target_problems: 674

model:
  name: Qwen/Qwen2.5-Math-7B-Instruct
  tensor_parallel_size: 1
  dtype: auto
  gpu_memory_utilization: 0.90
  max_model_len: 8192
  enforce_eager: true
  enable_thinking: true

generation:
  temperature: 0.3
  top_p: 0.9
  n_samples_per_problem: 4
  max_new_tokens: 4096
  logprobs: 5
  completion_prefix: "Step 1:"

paths:
  output_dir: data_generation/qwen25_fhis/outputs
  problems: data_generation/qwen25_fhis/outputs/problems.jsonl
  generated_traces: data_generation/qwen25_fhis/outputs/generated_traces.jsonl
  summary: data_generation/qwen25_fhis/outputs/summary.json
