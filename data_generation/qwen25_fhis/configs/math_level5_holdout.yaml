seed: 20260506

dataset:
  hf_name: EleutherAI/hendrycks_math
  subjects:
    algebra:
      levels: [5]
      max_problems: 100000
    number_theory:
      levels: [5]
      max_problems: 100000
    precalculus:
      levels: [5]
      max_problems: 100000
    intermediate_algebra:
      levels: [5]
      max_problems: 100000
  target_total: 30

model:
  name: Qwen/Qwen2.5-Math-7B-Instruct
  enable_thinking: true
  tensor_parallel_size: 1
  dtype: auto
  gpu_memory_utilization: 0.90
  max_model_len: 4096
  layers: [6, 13, 20, 27]

generation:
  temperature: 0.7
  top_p: 0.95
  n_samples_per_problem: 2
  max_new_tokens: 3072
  logprobs: 5
  completion_prefix: "Step 1:"

labels:
  annotator_model: gpt-5.5
  keep_confidence: high
  max_traces: null

split:
  train: 0.70
  val: 0.15
  test: 0.15

probe:
  kind: logistic
  max_iter: 2000
  class_weight: balanced

paths:
  problems: data_generation/qwen25_fhis/holdouts/math_level5/problems.jsonl
  generated_traces: data_generation/qwen25_fhis/holdouts/math_level5/generated_traces.jsonl
  labels: data_generation/qwen25_fhis/holdouts/math_level5/fhis_labels_train_high.jsonl
  hidden_states: data_generation/qwen25_fhis/holdouts/math_level5/step_hidden_states.pt
  metrics: data_generation/qwen25_fhis/holdouts/math_level5/probe_eval_metrics.json
  layer_sweep: data_generation/qwen25_fhis/holdouts/math_level5/layer_sweep.csv
  probe_model: data_generation/qwen25_fhis/results/hidden_logistic_probe.joblib
